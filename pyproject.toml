[project]
name = "job-application-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "guille", email = "gmendoza@students.pitzer.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "google-cloud-firestore>=2.31.0",
    "google-genai>=2.23.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "tenacity>=9.1.4",
]

[project.scripts]
job-application-agent = "job_application_agent:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
