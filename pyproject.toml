[project]
name = "job-application-agent"
version = "0.1.0"
description = "Privacy-conscious job application tracking agent using Gmail, Gemini, deterministic decision logic, Google Sheets, and Firestore."
readme = "README.md"
authors = [
    { name = "Guillermo Mendoza" }
]
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "google-cloud-firestore>=2.31.0",
    "google-genai>=2.23.0",
    "pydantic>=2.13.5",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
]
